[project]
name = "inventory-transfer-service"
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.12"

[tool.poetry]
name = "inventory-transfer-service"
version = "1.0.0"
package-mode = false

[tool.poetry.dependencies]
fastapi = "0.142.2"
uvicorn = "0.54.0"
psycopg = {version = "3.3.6", extras = ["binary"]}
psycopg-pool = "3.3.3"
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "N"]
